<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mediora AI | Clinical Interface</title>
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<link rel="stylesheet" href="../static/chatbot/base.css">
<link rel="icon" type="image/png" href="/static/assets/favicon_new.png">

</head>
<body>

<aside id="sidebar">
    <div class="sidebar-close-btn" onclick="app.toggleSidebar()">
        <i class="ph ph-x"></i>
    </div>

    <div class="sidebar-header">
        <button class="new-chat-btn" onclick="app.showHome()">
        <i class="ph ph-plus"></i>
        <span>New Consultation</span>
        </button>
    </div>
    <div class="chat-list" id="chat-list"></div>
    
    <div class="user-section">
        <div class="user-card">
            <div class="user-info">
                <div class="user-avatar">
                    <i class="ph-fill ph-user"></i>
                </div>
                <div class="user-details">
                    <span id="user-display-name">Guest User</span>
                    <span class="user-status">Online</span>
                </div>
            </div>
            <button class="logout-btn" onclick="app.openLogoutModal()" title="Logout">
                <i class="ph ph-power"></i>
            </button>
        </div>
    </div>
    </aside>
    
    <div id="logout-modal-overlay" class="modal-overlay">
    <div class="modal-box">
        <h3 style="margin-bottom:8px;">Logout?</h3>
        <p style="color:var(--text-muted); font-size:0.85rem;">Are you sure you want to log out of your session?</p>
        <div class="modal-btns">
        <button class="m-btn m-cancel" onclick="app.closeLogoutModal()">Cancel</button>
        <button class="m-btn m-confirm" onclick="app.confirmLogout()">Logout</button>
        </div>
    </div>
    </div>
    
    <div id="modal-overlay" class="modal-overlay">
    <div class="modal-box">
        <h3 style="margin-bottom:8px;">Delete Chat?</h3>
        <p style="color:var(--text-muted); font-size:0.85rem;">Are you sure you want to delete this chat?</p>
        <div class="modal-btns">
        <button class="m-btn m-cancel" onclick="app.closeModal()">Cancel</button>
        <button class="m-btn m-confirm" onclick="app.confirmDelete()">Delete</button>
        </div>
    </div>
    </div>
    
    <main id="main-content">
        <header>
            <div style="display: flex; align-items: center; gap: 15px;">
                <i class="ph ph-list mobile-menu-btn" 
                style="font-size: 1.5rem; cursor: pointer; display: none;" 
                onclick="app.toggleSidebar()"></i>
                
                <div style="font-weight: 500; letter-spacing: 0.5px; cursor:pointer" onclick="app.showHome()">
                    MEDIORIA <span style="color: var(--accent)">AI</span>
                </div>
            </div>
            <i class="ph ph-activity" style="font-size: 1.5rem; color: var(--text-muted)"></i>
        </header>
    
    <div id="chat-container">
        <div id="home-screen">
        <div class="home-content">
            <h1>How can I help you today?</h1>
            <p>Describe your symptoms or upload medical reports for a clinical summary.</p>
        </div>
        </div>
        <div id="messages-wrapper"></div>
    </div>
    
    <div class="input-wrapper">
        <div class="input-box">
        <div id="preview-strip"></div>
        <div class="input-row">
            <input type="file" id="file-trigger" hidden multiple onchange="app.handleFiles(this.files)" autofocus>
            <button class="action-btn" onclick="document.getElementById('file-trigger').click()"><i class="ph ph-paperclip"></i></button>
            <textarea id="user-input" placeholder="Message Mediora..." rows="1"></textarea>
            <button id="send-btn" class="action-btn send-btn" onclick="app.send()"><i class="ph-fill ph-paper-plane-right"></i></button>
        </div>
        </div>
    
        <div class="chip-row">
            <div class="chip" onclick="app.fill('Summarize medical history')">Summarize History</div>
            <div class="chip" onclick="app.fill('Check medication interactions')">Drug Interactions</div>
            <div class="chip" onclick="app.fill('Analyze lab results')">Analyze Labs</div>
        </div>
    </div>
    </main>

<script src="../static/chatbot/mediora.js"></script>
</body>
</html>
