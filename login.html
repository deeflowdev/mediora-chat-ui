<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mediora AI | Sign In</title>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="../static/auth/auth.css">
  <link rel="icon" type="image/png" href="/static/assets/favicon_new.png">
</head>
<body>

  <div class="auth-container" id="auth-card">
    <div class="brand">
      <div class="brand-name">MEDIORIA <span>AI</span></div>
      <p class="subtitle" id="form-subtitle">Sign in to start your consultation</p>
    </div>

    <form id="login-form">
      <div class="input-group">
        <label>Email or Username</label>
        <input type="text" id="login-id" placeholder="Enter your credentials" required>
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="login-pass" placeholder="••••••••" required>
      </div>
      <div id="msg"></div>
      <button type="submit" class="btn-submit">Sign In</button>
    </form>

    <form id="register-form" class="hidden">
      <div class="input-group">
        <label>Username</label>
        <input type="text" id="reg-user" placeholder="Pick a username" required>
      </div>
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="email@example.com" required>
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="reg-pass" placeholder="Create password" required>
      </div>
      <div class="input-group">
        <label>Confirm Password</label>
        <input type="password" id="reg-confirm" placeholder="Repeat password" required>
      </div>
      <div id="reg-msg"></div>
      <button type="submit" class="btn-submit">Create Account</button>
    </form>

    <p class="toggle-text" id="toggle-area">
      Don't have an account? <span class="toggle-link" onclick="auth.toggle()">Register</span>
    </p>
  </div>

  <div id="success-screen">
    <div class="brand-name">MEDIORIA <span>AI</span></div>
    <div class="loader"></div>
    <p style="color: var(--text-muted)">Entering consultation room...</p>
  </div>

  <script src="../static/auth/auth.js"></script>
</body>
</html>
